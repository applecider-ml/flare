[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flare-transients"
version = "2.0.0"
description = "Feature-based Light-curve Aggregated Ranking Ensemble — physics features + gradient-boosted trees for ZTF photometric transient classification with conformal uncertainty"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Argyro Sasli" }]
keywords = ["astronomy", "transients", "photometry", "ZTF", "TDE", "classification", "conformal", "lightgbm"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "light-curve>=0.9",
    "pyarrow>=12",
]

[project.scripts]
flare = "flare:_cli"

[project.optional-dependencies]
train = ["optuna>=3.5"]
research = ["torch>=2.2"]
figures = ["matplotlib>=3.7", "shap>=0.44"]
# the analysis-service path: callback upload + the optional PNG
skyportal = ["requests>=2.31", "matplotlib>=3.7"]
# the OSG runtime image on top of that (jax is not used by FLARE itself; the OSG
# wrapper environment expects it for its CPU-affinity setup)
osg = ["flare-transients[skyportal]", "jax"]

[tool.setuptools]
packages = ["flare"]
include-package-data = true

[tool.setuptools.package-data]
flare = ["../models/*.txt", "../models/*.json", "../models/bts6/*.txt", "../models/bts6/*.json", "../models/bts6/forecast/*.txt", "../models/bts6/forecast/*.json", "../models/bts6/forecast_blend/*.txt", "../models/bts6/forecast_blend/*.json", "../models/bts6/pe_ia/*.txt", "../models/bts6/pe_ia/*.json", "../models/bts6/early/h*/*.txt", "../models/bts6/early/h*/*.json", "../models/bts6/onnx/*"]
